# SwiftLint Configuration for Kheir App

excluded:
  - swift-composable-architecture
  - DerivedData
  - .build
  - Pods
  - KheirWidget

included:
  - Revenge
  - RevengeTests
  - RevengeUITests

# Rules
disabled_rules:
  - trailing_comma
  - todo
  - large_tuple

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - implicit_return
  - last_where
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

# Configuration
line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 8
  error: 10

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  validates_start_with_lowercase: warning
  excluded:
    - id
    - x
    - y
    - i
    - to
    - a
    - b
    - c
    - d
    - f
    - h
    - m
    - q

nesting:
  type_level: 3
  function_level: 3

reporter: "xcode"
