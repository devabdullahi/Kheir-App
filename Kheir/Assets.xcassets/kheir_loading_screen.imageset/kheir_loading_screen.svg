<svg width="320" height="580" viewBox="0 0 320 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="580" rx="36" fill="#1e5c2a"/>

  <!-- Background decorative circles -->
  <circle cx="60" cy="140" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="270" cy="460" r="150" fill="rgba(255,255,255,0.04)"/>

  <!-- Palm tree icon -->
  <g transform="translate(160, 210)">
    <!-- Trunk -->
    <rect x="-3" y="38" width="6" height="22" rx="3" fill="rgba(255,255,255,0.4)"/>
    <!-- Leaves -->
    <path d="M0,36 Q-22,18 -33,0" stroke="rgba(255,255,255,0.85)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q-18,12 -21,-6" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q-9,10 -10,-14" stroke="rgba(255,255,255,0.85)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q0,8 0,-18" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q9,10 10,-14" stroke="rgba(255,255,255,0.85)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q18,12 21,-6" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,36 Q22,18 33,0" stroke="rgba(255,255,255,0.85)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Dates -->
    <ellipse cx="-15" cy="40" rx="5" ry="7" fill="#c8a951"/>
    <ellipse cx="-5" cy="44" rx="5" ry="7" fill="#d4a843"/>
    <ellipse cx="5" cy="44" rx="5" ry="7" fill="#c8a951"/>
    <ellipse cx="15" cy="40" rx="5" ry="7" fill="#d4a843"/>
    <!-- Gold dot -->
    <circle cx="33" cy="0" r="4" fill="#c8a951"/>
  </g>

  <!-- App name -->
  <text x="160" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="2">Kheir</text>

  <!-- Divider -->
  <line x1="90" y1="326" x2="140" y2="326" stroke="#c8a951" stroke-width="0.8" opacity="0.6"/>
  <circle cx="160" cy="326" r="3" fill="#c8a951"/>
  <line x1="180" y1="326" x2="230" y2="326" stroke="#c8a951" stroke-width="0.8" opacity="0.6"/>

  <!-- Arabic -->
  <text x="160" y="360" text-anchor="middle" font-family="Arial, serif" font-size="26" fill="#c8a951" letter-spacing="4">خَيْر</text>
