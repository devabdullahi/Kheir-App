name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode and show environment
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Revenge.xcodeproj \
            -scheme Revenge

      - name: Build
        run: |
          set -o pipefail
          # Find first available iPhone simulator
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for runtime,devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(f\"platform=iOS Simulator,id={d['udid']}\")
                  sys.exit(0)
          " 2>/dev/null || echo "platform=iOS Simulator,name=iPhone 16")
          echo "Destination: $DEST"
          xcodebuild build \
            -project Revenge.xcodeproj \
            -scheme Revenge \
            -destination "$DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log
          echo "Build succeeded"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Run unit tests
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for runtime,devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(f\"platform=iOS Simulator,id={d['udid']}\")
                  sys.exit(0)
          " 2>/dev/null || echo "platform=iOS Simulator,name=iPhone 16")
          xcodebuild test \
            -project Revenge.xcodeproj \
            -scheme Revenge \
            -destination "$DEST" \
            -only-testing:RevengeTests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test.log
          echo "Tests passed"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test.log
          retention-days: 7

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
