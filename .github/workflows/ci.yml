name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep "iPhone 16" | head -3

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Revenge.xcodeproj \
            -scheme Revenge

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Revenge.xcodeproj \
            -scheme Revenge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log
          echo "Build succeeded"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Revenge.xcodeproj \
            -scheme Revenge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:RevengeTests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test.log
          echo "Tests passed"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test.log
          retention-days: 7

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
